<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponte a Brillar | Estudio de Perforación</title>
    <meta name="description" content="Es más que una perforación. Servicios, agenda de citas, catálogo base en titanio grado implante y sucursales.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           IDENTIDAD DE MARCA — PONTE A BRILLAR
           ========================================================= */
        :root {
            --cream: #FAF7F2;
            --cream-pure: #FFFFFF;
            --sand: #EFE8DC;
            --champagne: #DFD2BD;

            --cocoa: #3B2A20;
            --cocoa-soft: #6B5B50;
            --cocoa-faint: #9B8D82;

            --olive: #42522B;
            --olive-soft: #EFF3E9;
            --olive-line: rgba(66, 82, 43, 0.16);

            --gold: #BD9242;
            --gold-bright: #D6B166;
            --gold-soft: rgba(189, 146, 66, 0.14);

            --clay: #8F4238;
            --clay-bg: #F6EAE6;

            --line: rgba(59, 42, 32, 0.1);
            --line-strong: rgba(59, 42, 32, 0.2);

            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-pill: 999px;

            --max-w: 1020px;
            --header-h: 64px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background: var(--cream);
            color: var(--cocoa);
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--cream);
            background-image:
                radial-gradient(ellipse 80% 50% at 85% 0%, rgba(223, 210, 189, 0.38), transparent 60%),
                radial-gradient(ellipse 60% 45% at 10% 35%, rgba(239, 232, 220, 0.48), transparent 60%);
            color: var(--cocoa);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: 84px;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-serif);
            font-weight: 500;
            line-height: 1.08;
            letter-spacing: -0.01em;
        }

        a { color: inherit; text-decoration: none; }

        button {
            font-family: inherit;
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        /* =========================================================
           HEADER + BARRA DE PROGRESO
           ========================================================= */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 500;
            height: var(--header-h);
            background: rgba(250, 247, 242, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }

        .scroll-progress {
            position: absolute;
            left: 0;
            bottom: -1px;
            height: 1.5px;
            width: 0%;
            background: linear-gradient(90deg, var(--olive), var(--gold), var(--gold-bright));
            transition: width 0.08s linear;
        }

        .header-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.25rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-mark {
            color: var(--gold);
            display: inline-flex;
            transition: transform 0.6s var(--ease);
        }

        .brand:hover .brand-mark {
            transform: rotate(90deg) scale(1.08);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }

        .brand-name {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--cocoa);
        }

        .brand-sub {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--cocoa-faint);
        }

        /* 3 Menús principales (Escritorio) */
        .desktop-nav {
            display: none;
            align-items: center;
            gap: 2.25rem;
        }

        .desktop-nav a {
            font-size: 0.86rem;
            color: var(--cocoa-soft);
            position: relative;
            padding: 0.25rem 0;
            transition: color 0.25s ease;
        }

        .desktop-nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -3px;
            width: 100%;
            height: 1.5px;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.35s var(--ease);
        }

        .desktop-nav a:hover,
        .desktop-nav a.active {
            color: var(--cocoa);
        }

        .desktop-nav a:hover::after,
        .desktop-nav a.active::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .btn-cta-sm {
            position: relative;
            overflow: hidden;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 0.58rem 1.15rem;
            border-radius: var(--radius-pill);
            background: var(--olive);
            color: var(--cream-pure);
            transition: background 0.3s var(--ease);
            white-space: nowrap;
        }

        .btn-cta-sm:hover {
            background: var(--cocoa);
        }

        .shimmer-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.24) 50%, transparent 75%);
            transform: translateX(-120%);
            transition: transform 0.75s var(--ease);
        }

        .shimmer-btn:hover::after {
            transform: translateX(120%);
        }

        /* =========================================================
           HERO
           ========================================================= */
        .hero {
            padding: 3.75rem 0 3.25rem;
            border-bottom: 1px solid var(--line);
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--olive);
            font-weight: 600;
            margin-bottom: 1.15rem;
        }

        .sparkle-float {
            color: var(--gold);
            display: inline-flex;
            animation: sparkleBreath 4.2s ease-in-out infinite;
        }

        .sparkle-float.delay {
            animation-delay: 1.8s;
        }

        @keyframes sparkleBreath {
            0%, 100% { opacity: 0.65; transform: scale(0.92) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.12) rotate(12deg); }
        }

        .hero-headline-wrap {
            position: relative;
            max-width: 15ch;
        }

        .hero h1 {
            font-size: clamp(2.85rem, 9vw, 5.1rem);
            font-weight: 500;
            color: var(--olive);
            margin-bottom: 1.35rem;
        }

        .hero h1 em {
            font-style: italic;
            font-weight: 400;
            color: var(--cocoa);
        }

        .hero-accent-star {
            position: absolute;
            top: -8px;
            right: -10px;
            color: var(--gold);
            pointer-events: none;
        }

        .hero-lead {
            font-size: 0.98rem;
            color: var(--cocoa-soft);
            max-width: 48ch;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.75rem;
        }

        .btn-primary {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius-pill);
            background: var(--cocoa);
            color: var(--cream-pure);
            font-size: 0.86rem;
            font-weight: 500;
            transition: background 0.3s var(--ease), transform 0.25s var(--ease);
        }

        .btn-primary:hover {
            background: var(--olive);
            transform: translateY(-1px);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.84rem 1.35rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--line-strong);
            background: rgba(255, 255, 255, 0.55);
            color: var(--cocoa);
            font-size: 0.86rem;
            font-weight: 500;
            transition: border-color 0.25s ease, background 0.25s ease;
        }

        .btn-outline:hover {
            border-color: var(--gold);
            background: var(--cream-pure);
        }

        .pillars {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 2.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--line);
        }

        .pillar-label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--cocoa-faint);
            margin-bottom: 0.2rem;
        }

        .pillar-value {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            color: var(--cocoa);
            line-height: 1.2;
        }

        /* =========================================================
           ESTRUCTURA DE SECCIONES PRINCIPALES
           ========================================================= */
        .section {
            padding: 4.25rem 0;
            scroll-margin-top: calc(var(--header-h) + 10px);
        }

        .section-alt {
            background: var(--cream-pure);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .section-head {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .section-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--gold);
            font-weight: 600;
        }

        .section-title {
            font-size: clamp(2.15rem, 5.5vw, 3.15rem);
            color: var(--cocoa);
        }

        .section-desc {
            font-size: 0.92rem;
            color: var(--cocoa-soft);
            max-width: 54ch;
        }

        /* =========================================================
           01 · SERVICIOS (Submenú interno + Diseño + Bebés + Agenda)
           ========================================================= */
        .services-subnav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
        }

        .subnav-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--line-strong);
            background: var(--cream);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--cocoa);
            transition: all 0.25s var(--ease);
        }

        .subnav-pill:hover {
            border-color: var(--gold);
            background: var(--cream-pure);
        }

        .subnav-pill.highlight {
            background: var(--olive);
            border-color: var(--olive);
            color: var(--cream-pure);
        }

        .subnav-pill.highlight:hover {
            background: var(--cocoa);
            border-color: var(--cocoa);
        }

        .service-block {
            scroll-margin-top: calc(var(--header-h) + 20px);
        }

        .service-block + .service-block {
            margin-top: 3.25rem;
        }

        /* Bloque A: Diseño de Oreja */
        .design-grid {
            display: grid;
            gap: 2.25rem;
        }

        .sub-kicker {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--olive);
            font-weight: 600;
        }

        .sub-title {
            font-size: clamp(1.85rem, 4.5vw, 2.5rem);
            margin-top: 0.35rem;
            color: var(--cocoa);
        }

        .curator-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--cocoa);
            background: var(--sand);
            border: 1px solid var(--champagne);
            padding: 0.35rem 0.8rem;
            border-radius: var(--radius-pill);
            margin-top: 0.75rem;
        }

        .vanya-quote {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: clamp(1.42rem, 3.6vw, 1.9rem);
            line-height: 1.3;
            color: var(--cocoa);
            border-left: 2px solid var(--gold);
            padding-left: 1.2rem;
            margin: 1.5rem 0 0.65rem;
        }

        .vanya-author {
            padding-left: 1.2rem;
            font-size: 0.78rem;
            color: var(--cocoa-faint);
            margin-bottom: 1.5rem;
        }

        .package-card {
            background: var(--cream);
            border: 1px solid var(--champagne);
            border-radius: var(--radius-md);
            padding: 1.65rem;
        }

        .package-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 0.95rem;
            border-bottom: 1px solid var(--line);
            margin-bottom: 0.35rem;
        }

        .package-top h4 {
            font-size: 1.5rem;
            color: var(--olive);
        }

        .package-top span {
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--gold);
            font-weight: 600;
        }

        .includes-list {
            list-style: none;
        }

        .includes-list li {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 0.7rem;
            padding: 0.82rem 0;
            border-bottom: 1px solid var(--line);
            font-size: 0.87rem;
            color: var(--cocoa-soft);
            align-items: baseline;
        }

        .includes-list li:last-child {
            border-bottom: none;
            padding-bottom: 0.15rem;
        }

        .item-num {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.05rem;
            color: var(--gold);
        }

        .includes-list strong {
            color: var(--cocoa);
            font-weight: 600;
        }

        /* Bloque B: Bebés */
        .babies-box {
            background: var(--olive-soft);
            border: 1px solid var(--olive-line);
            border-radius: var(--radius-md);
            padding: clamp(1.6rem, 4vw, 2.75rem);
        }

        .babies-box .sub-title {
            font-style: italic;
            color: var(--olive);
        }

        .babies-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem 1.2rem;
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: var(--olive);
        }

        .steps-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.9rem;
            margin-top: 1.65rem;
        }

        .step-card {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid var(--olive-line);
            border-radius: var(--radius-sm);
            padding: 1.25rem;
            transition: transform 0.35s var(--ease), border-color 0.3s ease;
        }

        .step-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
        }

        .step-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }

        .step-num {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.5rem;
            color: var(--gold);
            line-height: 1;
        }

        .step-chip {
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--olive);
            opacity: 0.78;
        }

        .step-card h5 {
            font-family: var(--font-sans);
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--cocoa);
            margin-bottom: 0.3rem;
        }

        .step-card p {
            font-size: 0.83rem;
            color: var(--cocoa-soft);
            line-height: 1.55;
        }

        .no-gun-banner {
            margin-top: 1.35rem;
            padding: 1.1rem 1.25rem;
            background: var(--clay-bg);
            border-left: 3px solid var(--clay);
            border-radius: var(--radius-sm);
            color: var(--clay);
            font-size: 0.84rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .btn-olive {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.72rem 1.3rem;
            border-radius: var(--radius-pill);
            background: var(--olive);
            color: var(--cream-pure);
            font-size: 0.82rem;
            font-weight: 500;
            width: fit-content;
            transition: background 0.25s ease;
        }

        .btn-olive:hover {
            background: var(--cocoa);
        }

        /* Bloque C: Agenda tu cita (Integrado en Servicios) */
        .agenda-card {
            background: var(--cream);
            border: 1px solid var(--champagne);
            border-radius: var(--radius-md);
            padding: clamp(1.6rem, 4vw, 2.5rem);
            display: grid;
            gap: 2rem;
            transition: box-shadow 0.45s var(--ease), border-color 0.45s var(--ease);
        }

        .agenda-card.pulse-focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(189, 146, 66, 0.16);
        }

        .agenda-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.25rem;
        }

        .agenda-notes {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--cocoa-soft);
        }

        .agenda-notes li {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .agenda-notes svg {
            color: var(--gold);
            flex-shrink: 0;
        }

        .wa-direct-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.65rem 1rem;
            border-radius: var(--radius-sm);
            background: var(--cream-pure);
            border: 1px solid var(--line);
            font-size: 0.82rem;
            color: var(--cocoa);
            width: fit-content;
        }

        .wa-direct-pill span {
            color: var(--cocoa-faint);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .agenda-form {
            background: var(--cream-pure);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 1.4rem;
            display: grid;
            gap: 0.95rem;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.95rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.36rem;
        }

        .field label {
            font-size: 0.67rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--cocoa-faint);
            font-weight: 600;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 0.74rem 0.9rem;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-sm);
            background: var(--cream);
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--cocoa);
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--cream-pure);
        }

        .btn-wa-submit {
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.92rem 1.25rem;
            border-radius: var(--radius-pill);
            background: var(--olive);
            color: var(--cream-pure);
            font-size: 0.88rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            transition: background 0.25s ease;
        }

        .btn-wa-submit:hover {
            background: var(--cocoa);
        }

        /* =========================================================
           02 · CATÁLOGO BASE
           ========================================================= */
        .catalog-bar {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            padding: 1.1rem 1.2rem;
            background: var(--cream-pure);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 28px rgba(59, 42, 32, 0.03);
        }

        .bar-label {
            display: block;
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--cocoa-faint);
            margin-bottom: 0.5rem;
        }

        .material-toggle {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--sand);
            padding: 4px;
            border-radius: var(--radius-pill);
            width: 100%;
            max-width: 390px;
        }

        .toggle-glider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            border-radius: var(--radius-pill);
            background: var(--cream-pure);
            border: 1px solid rgba(189, 146, 66, 0.28);
            box-shadow: 0 2px 10px rgba(59, 42, 32, 0.08);
            transition: transform 0.42s var(--ease);
            pointer-events: none;
        }

        .material-toggle[data-active="titanio"] .toggle-glider {
            transform: translateX(100%);
        }

        .material-btn {
            position: relative;
            z-index: 1;
            padding: 0.55rem 0.85rem;
            font-size: 0.8rem;
            color: var(--cocoa-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: color 0.3s ease;
        }

        .material-btn strong {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .material-btn.active {
            color: var(--cocoa);
        }

        .material-btn[data-material="titanio"].active strong {
            color: var(--gold);
        }

        .zone-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .zone-pill {
            padding: 0.4rem 0.88rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--line);
            font-size: 0.76rem;
            color: var(--cocoa-soft);
            transition: all 0.25s var(--ease);
        }

        .zone-pill:hover {
            border-color: var(--gold);
            color: var(--cocoa);
        }

        .zone-pill.active {
            background: var(--olive);
            border-color: var(--olive);
            color: var(--cream-pure);
        }

        .catalog-list {
            border-top: 1px solid var(--line-strong);
        }

        .piercing-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.9rem 1.25rem;
            padding: 1.4rem 0.5rem;
            border-bottom: 1px solid var(--line);
            align-items: center;
            transition: background 0.3s var(--ease), padding-left 0.3s var(--ease);
            border-radius: 6px;
        }

        .piercing-row:hover {
            background: rgba(255, 255, 255, 0.72);
            padding-left: 0.9rem;
        }

        .piercing-title {
            display: flex;
            align-items: baseline;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        .piercing-name {
            font-family: var(--font-serif);
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--cocoa);
        }

        .piercing-zone {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--olive);
            background: var(--olive-soft);
            padding: 0.18rem 0.55rem;
            border-radius: var(--radius-pill);
            font-weight: 500;
        }

        .piercing-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem 1.3rem;
            margin-top: 0.45rem;
            font-size: 0.8rem;
            color: var(--cocoa-soft);
        }

        .meta-pair {
            display: inline-flex;
            align-items: center;
            gap: 0.38rem;
        }

        .meta-pair span.k { color: var(--cocoa-faint); }

        .pain-meter {
            display: inline-flex;
            gap: 3px;
            align-items: center;
            margin-left: 2px;
        }

        .pain-pip {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--champagne);
        }

        .pain-pip.on { background: var(--gold); }

        .piercing-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.35rem;
            text-align: right;
        }

        .price-val {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--cocoa);
        }

        .price-val.flash {
            animation: goldPulse 0.5s var(--ease);
        }

        @keyframes goldPulse {
            0% { opacity: 0.35; transform: translateY(-3px); color: var(--gold); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .price-sub {
            font-size: 0.7rem;
            color: var(--cocoa-faint);
        }

        .row-book-btn {
            margin-top: 0.2rem;
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--olive);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s ease, gap 0.25s var(--ease);
        }

        .row-book-btn:hover {
            color: var(--gold);
            gap: 0.5rem;
        }

        .labret-note {
            margin-top: 1.5rem;
            padding: 1rem 1.2rem;
            background: var(--sand);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            font-size: 0.82rem;
            color: var(--cocoa-soft);
        }

        .labret-note strong { color: var(--cocoa); font-weight: 600; }
        .labret-note svg { flex-shrink: 0; color: var(--gold); margin-top: 2px; }

        /* =========================================================
           03 · SUCURSALES
           ========================================================= */
        .locations-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .location-card {
            background: var(--cream);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.25rem;
            transition: transform 0.35s var(--ease), border-color 0.3s ease, box-shadow 0.35s var(--ease);
        }

        .location-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: 0 12px 28px rgba(59, 42, 32, 0.05);
        }

        .location-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.45rem;
        }

        .location-card h3 {
            font-size: 1.55rem;
            color: var(--cocoa);
        }

        .location-badge {
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--gold);
            background: var(--gold-soft);
            padding: 0.24rem 0.62rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            white-space: nowrap;
        }

        .location-address {
            font-size: 0.86rem;
            color: var(--cocoa-soft);
        }

        .location-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .arrow-link {
            display: inline-flex;
            align-items: center;
            gap: 0.32rem;
            color: var(--cocoa);
            transition: color 0.2s ease, gap 0.25s var(--ease);
        }

        .arrow-link:hover {
            color: var(--gold);
            gap: 0.5rem;
        }

        /* =========================================================
           FOOTER
           ========================================================= */
        .site-footer {
            border-top: 1px solid var(--line);
            padding: 2.25rem 0 2rem;
            font-size: 0.8rem;
            color: var(--cocoa-faint);
        }

        .footer-inner {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            align-items: center;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 0.42rem;
            color: var(--cocoa);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .social-link:hover { color: var(--gold); }

        /* =========================================================
           NAVEGACIÓN MÓVIL (3 MENÚS PRINCIPALES)
           ========================================================= */
        .mobile-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 600;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 0.48rem 0.5rem calc(0.48rem + env(safe-area-inset-bottom));
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.24rem;
            padding: 0.38rem 0.25rem;
            font-size: 0.68rem;
            color: var(--cocoa-faint);
            position: relative;
            transition: color 0.2s ease;
        }

        .mobile-nav-item svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }

        .mobile-nav-item.active {
            color: var(--olive);
            font-weight: 600;
        }

        .mobile-nav-item.active::before {
            content: "";
            position: absolute;
            top: -0.48rem;
            width: 28px;
            height: 2px;
            background: var(--gold);
        }

        /* =========================================================
           TOAST SUTIL DE PRESELECCIÓN
           ========================================================= */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translate(-50%, 16px);
            background: var(--cocoa);
            color: var(--cream-pure);
            font-size: 0.78rem;
            padding: 0.62rem 1.15rem;
            border-radius: var(--radius-pill);
            box-shadow: 0 10px 26px rgba(59, 42, 32, 0.22);
            opacity: 0;
            pointer-events: none;
            z-index: 900;
            white-space: nowrap;
            transition: opacity 0.3s ease, transform 0.35s var(--ease);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* =========================================================
           ANIMACIONES ESCALONADAS
           ========================================================= */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.65s var(--ease), transform 0.65s var(--ease);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .stagger-item {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.55s var(--ease), transform 0.55s var(--ease);
        }

        .visible .stagger-item {
            opacity: 1;
            transform: translateY(0);
        }

        .visible .stagger-item:nth-child(2) { transition-delay: 0.07s; }
        .visible .stagger-item:nth-child(3) { transition-delay: 0.14s; }
        .visible .stagger-item:nth-child(4) { transition-delay: 0.21s; }
        .visible .stagger-item:nth-child(5) { transition-delay: 0.28s; }
        .visible .stagger-item:nth-child(6) { transition-delay: 0.35s; }

        @media (prefers-reduced-motion: reduce) {
            .reveal, .stagger-item { opacity: 1; transform: none; transition: none; }
            .sparkle-float { animation: none; }
            html { scroll-behavior: auto; }
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */
        @media (min-width: 768px) {
            body { padding-bottom: 0; }
            .container { padding: 0 2rem; }
            .desktop-nav { display: flex; }
            .mobile-nav { display: none; }
            .toast { bottom: 26px; }

            .hero { padding: 5.25rem 0 4rem; }

            .design-grid {
                grid-template-columns: 0.92fr 1.08fr;
                align-items: start;
                gap: 3.25rem;
            }

            .steps-grid { grid-template-columns: repeat(2, 1fr); }

            .no-gun-banner {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }

            .agenda-card {
                grid-template-columns: 0.88fr 1.12fr;
                align-items: start;
                gap: 2.5rem;
            }

            .form-row-2 {
                grid-template-columns: 1fr 1fr;
            }

            .catalog-bar {
                flex-direction: row;
                align-items: flex-end;
                justify-content: space-between;
                padding: 1.25rem 1.5rem;
            }

            .locations-grid { grid-template-columns: repeat(3, 1fr); }

            .footer-inner {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        @media (min-width: 1024px) {
            .steps-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
